<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataInvestments - Visor de Datos de Inversión</title>
    <meta name="description" content="Consulta y visualiza información financiera de empresas con fines informativos y educativos. No constituye asesoramiento financiero ni recomendación de inversión." />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('di-theme');
          if (t !== 'light') t = 'dark';
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
