name: Deploy to VPS

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          COOKIE_SECURE: "false"
          NODE_ENV: "production"
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,SESSION_SECRET,FINNHUB_API_KEY,SEC_USER_AGENT,COOKIE_SECURE,NODE_ENV
          script: |
            cd /home/deploy/DataInvestments
            git checkout dev
            git pull origin dev

            cat > .env.prod << EOF
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
            SESSION_SECRET=${SESSION_SECRET}
            FINNHUB_API_KEY=${FINNHUB_API_KEY}
            SEC_USER_AGENT=${SEC_USER_AGENT}
            NODE_ENV=${NODE_ENV}
            COOKIE_SECURE=${COOKIE_SECURE}
            EOF

            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --env-file .env.prod up -d --build --remove-orphans

            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --env-file .env.prod exec -T backend \
              npx prisma db push --schema=src/infrastructure/prisma/schema.prisma

            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --env-file .env.prod exec -T backend \
              node dist/infrastructure/prisma/seed.js

            docker image prune -f
