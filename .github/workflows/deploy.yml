name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Deploy & Sync
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          COOKIE_SECURE: "true"
          NODE_ENV: production
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend npx prisma db push --schema=src/infrastructure/prisma/schema.prisma
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend node dist/infrastructure/prisma/seed.js
