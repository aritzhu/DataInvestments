name: Deploy to VPS

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          COOKIE_SECURE: "false"
          NODE_ENV: "production"
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,SESSION_SECRET,SEC_USER_AGENT,COOKIE_SECURE,NODE_ENV
          script: |
            cd /home/deploy/DataInvestments
            git checkout dev
            git pull origin dev

            # Strip trailing newlines that GitHub secrets sometimes include
            POSTGRES_PASSWORD=$(printf '%s' "$POSTGRES_PASSWORD" | tr -d '\n')
            SESSION_SECRET=$(printf '%s' "$SESSION_SECRET" | tr -d '\n')
            cat > .env.prod << EOF
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
            SESSION_SECRET=${SESSION_SECRET}
            SEC_USER_AGENT=${SEC_USER_AGENT}
            NODE_ENV=${NODE_ENV}
            COOKIE_SECURE=${COOKIE_SECURE}
            EOF

            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --env-file .env.prod up -d --build --remove-orphans

            # Ensure trust auth for Docker network connections
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --env-file .env.prod exec -T db sh -c \
              "echo 'host all all 0.0.0.0/0 trust' >> /var/lib/postgresql/data/pg_hba.conf && \
               echo 'host all all ::/0 trust' >> /var/lib/postgresql/data/pg_hba.conf"

            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --env-file .env.prod exec -T db psql -U postgres \
              -c "SELECT pg_reload_conf();"

            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --env-file .env.prod exec -T backend \
              npx prisma db push --schema=src/infrastructure/prisma/schema.prisma --accept-data-loss

            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --env-file .env.prod exec -T backend \
              node dist/infrastructure/prisma/seed.js

            docker image prune -f
