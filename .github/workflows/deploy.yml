name: Deploy to VPS

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          COOKIE_SECURE: "false"
          NODE_ENV: "production"
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,SESSION_SECRET,SEC_USER_AGENT,COOKIE_SECURE,NODE_ENV
          script: |
            set -e
            cd /home/deploy/DataInvestments
            git fetch origin dev
            git reset --hard origin/dev
            git clean -fd

            # Strip trailing newlines that GitHub secrets sometimes include
            POSTGRES_PASSWORD=$(printf '%s' "$POSTGRES_PASSWORD" | tr -d '\n')
            SESSION_SECRET=$(printf '%s' "$SESSION_SECRET" | tr -d '\n')
            cat > .env.prod << EOF
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@datainvestments-db:5432/${POSTGRES_DB}
            SESSION_SECRET=${SESSION_SECRET}
            JWT_SECRET=${SESSION_SECRET}
            SEC_USER_AGENT=${SEC_USER_AGENT}
            NODE_ENV=${NODE_ENV}
            COOKIE_SECURE=${COOKIE_SECURE}
            EOF

            DC="docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod"

            # Build images (db uses official postgres:16-alpine, no build needed)
            $DC build

            # Start db only and wait for it to accept connections
            $DC up -d db
            echo "Waiting for database..."
            for i in $(seq 1 30); do
              $DC exec -T db pg_isready -U postgres && break || sleep 1
            done

            # Push schema (one-shot container, independent of running backend)
            echo "Pushing schema..."
            $DC run --rm backend \
              npx prisma db push --schema=src/infrastructure/prisma/schema.prisma --accept-data-loss

            # Seed data (one-shot container)
            echo "Seeding data..."
            $DC run --rm backend \
              node dist/infrastructure/prisma/seed.js

            # Start remaining services without restarting db
            $DC rm -fsv frontend backend 2>/dev/null || true
            $DC up -d --no-deps backend frontend

            # Wait for backend to be ready before reloading nginx
            echo "Waiting for backend..."
            for i in $(seq 1 15); do
              curl -sf http://localhost:3001/health > /dev/null 2>&1 && break || sleep 2
            done
            curl -sf http://localhost:3001/health > /dev/null 2>&1 || { echo "Backend failed to become healthy"; exit 1; }

            # Backfill missing company metadata (logos, websites, sectors) for any new/updated tickers
            echo "Running metadata backfill..."
            $DC run --rm backend node dist/scripts/backfillCompanyMeta.js

            # Reload gateway nginx so it picks up any changes
            echo "Reloading gateway nginx..."
            docker exec deploy-gateway nginx -s reload || true

            docker image prune -f
